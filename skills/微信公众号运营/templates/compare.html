<!DOCTYPE html>
<!-- 双栏对比模板 1080x660。只改标题、副题、两栏表头和条目。版式配色勿动。
     渲染: bash ../scripts/render_images.sh 1080x660 compare.html compare.png -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 660px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #081426 0%, #0C2242 60%, #10294E 100%);
    color: #F2F5FA;
    padding: 44px 56px;
  }
  .title { text-align: center; font-size: 32px; font-weight: 700; letter-spacing: 3px; }
  .subtitle { text-align: center; margin-top: 8px; font-size: 15px; letter-spacing: 4px; color: #D4A93C; }
  .cols { display: flex; gap: 32px; margin-top: 28px; }
  .col { flex: 1; border-radius: 12px; padding: 24px 30px; }
  .col.old { background: rgba(255,255,255,0.04); border: 1px solid rgba(169,187,214,0.3); }
  .col.new { background: rgba(212,169,60,0.08); border: 1px solid rgba(212,169,60,0.55); }
  .head { font-size: 23px; font-weight: 700; margin-bottom: 6px; }
  .col.old .head { color: #8FA3BF; }
  .col.new .head { color: #E8C56A; }
  .tag { font-size: 14px; color: #8A93A6; margin-bottom: 16px; }
  .item {
    font-size: 18px; line-height: 1.55; color: #C9D6EA;
    padding: 9px 0 9px 26px; position: relative;
    border-top: 1px dashed rgba(169,187,214,0.2);
  }
  .item::before { position: absolute; left: 0; top: 12px; font-size: 16px; }
  .col.old .item::before { content: "✕"; color: #B0654F; }
  .col.new .item::before { content: "✓"; color: #E8C56A; }
</style>
</head>
<body>
  <div class="title">对比图大标题</div>
  <div class="subtitle">一句话点出对比核心</div>
  <div class="cols">
    <div class="col old">
      <div class="head">旧做法 / 没有 X</div>
      <div class="tag">一句注解</div>
      <div class="item">痛点条目一</div>
      <div class="item">痛点条目二</div>
      <div class="item">痛点条目三</div>
      <div class="item">痛点条目四</div>
      <div class="item">痛点条目五</div>
    </div>
    <div class="col new">
      <div class="head">新做法 / 有了 X</div>
      <div class="tag">一句注解</div>
      <div class="item">收益条目一</div>
      <div class="item">收益条目二</div>
      <div class="item">收益条目三</div>
      <div class="item">收益条目四</div>
      <div class="item">收益条目五</div>
    </div>
  </div>
</body>
</html>
