<!DOCTYPE html>
<!-- 分层总览模板 1080x820（6 层，增减 .row 行后同步调高度）。只改文字。版式配色勿动。
     渲染: bash ../scripts/render_images.sh 1080x820 stack.html stack.png -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 820px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #081426 0%, #0C2242 60%, #10294E 100%);
    color: #F2F5FA;
    padding: 46px 64px;
  }
  .title { text-align: center; }
  .title .zh { font-size: 34px; font-weight: 700; letter-spacing: 3px; }
  .title .en { margin-top: 8px; font-size: 15px; letter-spacing: 5px; color: #D4A93C; }
  .stack { margin-top: 34px; }
  .row {
    display: flex; align-items: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(169,187,214,0.28);
    border-left: 4px solid #D4A93C;
    border-radius: 10px;
    padding: 15px 26px;
    margin-bottom: 14px;
  }
  .num { font-size: 26px; font-weight: 700; color: #E8C56A; width: 58px; flex-shrink: 0; }
  .name { font-size: 25px; font-weight: 700; letter-spacing: 1px; width: 250px; flex-shrink: 0; }
  .desc { font-size: 18px; color: #A9BBD6; line-height: 1.5; }
  .arrow { text-align: center; color: #D4A93C; font-size: 15px; letter-spacing: 4px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="title">
    <div class="zh">总览图大标题</div>
    <div class="en">一句副标题</div>
  </div>
  <div class="stack">
    <div class="row"><span class="num">01</span><span class="name">第一层</span><span class="desc">这一层是什么、解决什么问题</span></div>
    <div class="row"><span class="num">02</span><span class="name">第二层</span><span class="desc">这一层是什么、解决什么问题</span></div>
    <div class="row"><span class="num">03</span><span class="name">第三层</span><span class="desc">这一层是什么、解决什么问题</span></div>
    <div class="row"><span class="num">04</span><span class="name">第四层</span><span class="desc">这一层是什么、解决什么问题</span></div>
    <div class="row"><span class="num">05</span><span class="name">第五层</span><span class="desc">这一层是什么、解决什么问题</span></div>
    <div class="row"><span class="num">06</span><span class="name">第六层</span><span class="desc">这一层是什么、解决什么问题</span></div>
  </div>
  <div class="arrow">底部一句话总结</div>
</body>
</html>
