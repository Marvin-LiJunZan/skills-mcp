<!DOCTYPE html>
<!-- 封面模板 900x383（2.35:1）。只改文字：期号、副标题、底部 chips。版式和配色勿动。
     渲染: bash ../scripts/render_images.sh 900x383 cover.html cover.png -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 900px; height: 383px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #081426 0%, #0C2242 55%, #123058 100%);
    position: relative;
    color: #F2F5FA;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(212,169,60,0.05) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(90deg, rgba(212,169,60,0.05) 0 1px, transparent 1px 48px);
  }
  .glow {
    position: absolute; right: -140px; top: -140px;
    width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,169,60,0.28) 0%, rgba(212,169,60,0) 70%);
  }
  .frame { position: absolute; inset: 18px; border: 1px solid rgba(212,169,60,0.45); }
  .content { position: absolute; left: 64px; top: 56px; right: 64px; }
  .brand {
    display: inline-block;
    font-size: 15px; letter-spacing: 6px; color: #D4A93C;
    border: 1px solid rgba(212,169,60,0.6);
    padding: 5px 14px 5px 18px;
  }
  h1 { margin-top: 26px; font-size: 58px; font-weight: 700; letter-spacing: 4px; }
  h1 .num { color: #E8C56A; }
  .sub { margin-top: 14px; font-size: 24px; color: #A9BBD6; letter-spacing: 2px; }
  .chips { position: absolute; left: 64px; bottom: 42px; }
  .chip {
    display: inline-block; margin-right: 12px;
    font-size: 15px; color: #C9D6EA; letter-spacing: 1px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(169,187,214,0.35);
    padding: 6px 14px; border-radius: 999px;
  }
  .chip.gold { color: #E8C56A; border-color: rgba(212,169,60,0.6); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="content">
    <span class="brand">未筑之境</span>
    <h1>研究生生存栈 01 <span class="num">02</span></h1>
    <div class="sub">本期副标题写在这里</div>
  </div>
  <div class="chips">
    <span class="chip">关键词一</span>
    <span class="chip">关键词二</span>
    <span class="chip gold">核心亮点</span>
    <span class="chip">关键词四</span>
  </div>
</body>
</html>
